[project]
name = "mailroom"
version = "0.1.0"
description = "Bilingual official-mail triage agent built on the Cohere stack (Command, Embed, Rerank)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=5.13",
    "httpx>=0.27",
    "lancedb>=0.17",
    "pydantic>=2.9",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyarrow>=17",
    "ruff>=0.9",
]

[project.scripts]
mailroom = "mailroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailroom"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer reads its options from the function defaults, which is the documented
# pattern and not a mutable-default bug.
"mailroom/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Cohere API; requires COHERE_API_KEY"]
