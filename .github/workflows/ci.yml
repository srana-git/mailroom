name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test offline
        run: uv run pytest -q -m "not live"
